plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}+${project.target_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://jitpack.io" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Optional config UI. Transitive Minecraft 26.1 artifacts must not override 26.2.
	compileOnly("com.github.contariaa:SpeedrunAPI:${project.speedrunapi_version}") {
		transitive = false
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def archiveName = project.base.archivesName.get()
	from("LICENSE.txt") {
		rename { "${it}_${archiveName}" }
	}
}

tasks.register('generateJniHeaders', Exec) {
	description = 'Generate JNI headers for MacPresentationUtil'
	group = 'build'

	dependsOn 'compileJava'

	inputs.files 'src/main/java/com/slackow/boundlesswindow/MacPresentationUtil.java'
	outputs.file 'build/generated/sources/headers/java/main/com_slackow_boundlesswindow_MacPresentationUtil.h'

	doFirst {
		file('build/generated/sources/headers/java/main').mkdirs()
	}

	executable "${System.getProperty('java.home')}/bin/javac"
	args '-h', 'build/generated/sources/headers/java/main'
	args '-cp', sourceSets.main.output.classesDirs.asPath
	args 'src/main/java/com/slackow/boundlesswindow/MacPresentationUtil.java'
}

tasks.register('buildMacUtilNative', Exec) {
	description = 'Compile universal libmacutil.dylib for macOS'
	group = 'build'

	inputs.files 'src/native/MacUtilJNI.m'
	outputs.file 'src/main/resources/natives/darwin/libmacutil.dylib'

	dependsOn 'generateJniHeaders'

	doFirst {
		def jdkHome = System.getProperty('java.home')

		commandLine 'clang',
				'-std=gnu11', '-fobjc-arc', '-mmacosx-version-min=10.13',
				'-arch', 'x86_64', '-arch', 'arm64',
				'-Isrc/native', '-Ibuild/generated/sources/headers/java/main',
				"-I${jdkHome}/include", "-I${jdkHome}/include/darwin",
				'-framework', 'Cocoa',
				'-dynamiclib', 'src/native/MacUtilJNI.m',
				'-o', 'src/main/resources/natives/darwin/libmacutil.dylib'
	}
}

tasks.named("processResources").configure {
	dependsOn "buildMacUtilNative"
}

tasks.named("sourcesJar").configure {
	dependsOn "buildMacUtilNative"
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
